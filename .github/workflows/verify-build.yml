name: Verify and build

on:
  push:
    branches: [main, codex-issues-7-11-20260916, 'codex/lyric-polish-20260916', 'codex/debug-cache-package-20260917']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Reproducible source snapshot
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: git archive --format=zip --output=source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: source-${{ github.sha }}
          path: source.zip
          retention-days: 3

  windows:
    name: Tests and Windows x64 portable
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      LYRIC_TEST_FONT_PATH: C:/Windows/Fonts/arial.ttf
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install audio test fixture encoder
        run: choco install ffmpeg --no-progress -y
      - run: npm run typecheck
      - run: npm test
      - name: Native resource and desktop policy tests
        run: node --test tests/*.test.mjs
      - name: Install browser for regression tests
        run: npx playwright install chromium
      - name: Browser issue regressions
        run: node scripts/test-issue-regressions.mjs
      - name: Round two playback and persistence regressions
        run: node scripts/test-round2-regressions.mjs
      - name: Lyric polish regressions
        run: node scripts/test-lyric-polish.mjs
      - name: Debug, report privacy and cache regressions
        run: npm run test:debug
      - name: Production audio analysis and WASM regressions
        run: |
          npm run build
          node scripts/test-audio-analysis.mjs
      - name: Build Windows portable
        run: npm run desktop:build
      - name: Packaged diagnostics and local WASM smoke test
        run: node scripts/test-packaged-debug.mjs
      - name: Check desktop payload budget
        run: npm run desktop:budget
      - name: Compare portable size against previous main with the same toolchain
        if: github.ref == 'refs/heads/codex/debug-cache-package-20260917'
        continue-on-error: true
        shell: pwsh
        run: |
          $baseline = Join-Path $env:RUNNER_TEMP 'lyric-size-baseline'
          git fetch --depth=1 origin 800ca8015426d96a33ec90edc32b81fc7cde27dd
          if ($LASTEXITCODE -ne 0) { throw 'Cannot fetch size baseline' }
          git worktree add --detach $baseline FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Cannot create baseline worktree' }
          New-Item -ItemType Junction -Path (Join-Path $baseline 'node_modules') -Target (Join-Path $env:GITHUB_WORKSPACE 'node_modules') | Out-Null
          Push-Location $baseline
          try {
            npm run desktop:build
            if ($LASTEXITCODE -ne 0) { throw 'Baseline portable build failed' }
          } finally { Pop-Location }
          $before = Get-ChildItem (Join-Path $baseline 'release/*.exe') | Select-Object -First 1
          $after = Get-ChildItem 'release/*.exe' | Select-Object -First 1
          if (!$before -or !$after) { throw 'Portable output missing' }
          [ordered]@{ baselineCommit='800ca8015426d96a33ec90edc32b81fc7cde27dd'; currentCommit='${{ github.sha }}'; beforeBytes=$before.Length; afterBytes=$after.Length; savedBytes=($before.Length-$after.Length); savedPercent=[math]::Round(100*($before.Length-$after.Length)/$before.Length,4); note='Same Windows runner, Electron and installed dependencies; unsigned portable builds.' } | ConvertTo-Json | Tee-Object -FilePath test-results/portable-size-comparison.json
      - uses: actions/upload-artifact@v4
        with:
          name: Lyric-Player-Windows-x64-${{ github.sha }}
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: Lyric-Player-Web-${{ github.sha }}
          path: build/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Regression-report-${{ github.sha }}
          path: |
            test-results/issues-7-11/
            test-results/issues-1-6/
            test-results/lyric-polish/
            test-results/debug-diagnostics/
            test-results/package-size.json
            test-results/portable-size-comparison.json
            test-results/packaged-debug/report.json
            test-results/packaged-debug/failure.json
            test-results/packaged-debug/debug-report.json
            test-results/packaged-debug/advanced.png
            test-results/audio-analysis/report.json
          if-no-files-found: ignore
          retention-days: 14
