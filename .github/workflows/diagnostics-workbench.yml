name: Debug diagnostics verification

on:
  push:
    branches: ['codex/debug-cache-package-20260917']
    paths: ['.github/workflows/diagnostics-workbench.yml', '.github/diagnostic-update/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    name: Apply reviewed source update
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.commit.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Validate and apply exact source patch
        shell: bash
        run: |
          if [ -d .github/diagnostic-update ]; then
            git diff --quiet 32e65c14ddb88685e04138053e7fcd76467c41d9 HEAD -- . ':(exclude).github/workflows/diagnostics-workbench.yml' ':(exclude).github/diagnostic-update/**'
            python - <<'PY'
          import base64, hashlib, lzma, os, pathlib, subprocess
          encoded = ''.join(pathlib.Path(f'.github/diagnostic-update/{i}.b64').read_text() for i in range(4))
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'f64485a1c7e95a03a82b6d3938c642cfb0723df25d9cf38bb00aea823ebbe23d', 'Source checksum mismatch'
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'debug-update.patch'
          target.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', '--unidiff-zero', str(target)], check=True)
          subprocess.run(['git', 'apply', '--index', '--unidiff-zero', str(target)], check=True)
          PY
            git diff --cached --check
            git rm -r .github/diagnostic-update
          fi
      - name: Save validated source on working branch
        id: commit
        shell: bash
        run: |
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'feat: complete debug diagnostics and bound caches and desktop payload'
            git push origin HEAD:codex/debug-cache-package-20260917
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  windows:
    name: Regression tests and Windows portable
    needs: apply
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      LYRIC_TEST_FONT_PATH: C:/Windows/Fonts/arial.ttf
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.apply.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install audio test fixture encoder
        run: choco install ffmpeg --no-progress -y
      - run: npm run typecheck
      - run: npm test
      - name: Desktop, privacy and log rotation tests
        run: node --test tests/*.test.mjs
      - name: Install browser for regression tests
        run: npx playwright install chromium
      - name: Browser issue regressions
        run: node scripts/test-issue-regressions.mjs
      - name: Playback and persistence regressions
        run: node scripts/test-round2-regressions.mjs
      - name: Lyric polish regressions
        run: node scripts/test-lyric-polish.mjs
      - name: Normal and Debug Mode regressions
        run: npm run test:debug
      - name: Production audio analysis and WASM regressions
        run: |
          npm run build
          node scripts/test-audio-analysis.mjs
      - name: Build Windows portable
        run: npm run desktop:build
      - name: Check desktop payload budget
        run: npm run desktop:budget
      - name: Compare portable size against previous main with same toolchain
        continue-on-error: true
        shell: pwsh
        run: |
          $baseline = Join-Path $env:RUNNER_TEMP 'lyric-size-baseline'
          git fetch --depth=1 origin 800ca8015426d96a33ec90edc32b81fc7cde27dd
          if ($LASTEXITCODE -ne 0) { throw 'Cannot fetch size baseline' }
          git worktree add --detach $baseline FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Cannot create baseline worktree' }
          New-Item -ItemType Junction -Path (Join-Path $baseline 'node_modules') -Target (Join-Path $env:GITHUB_WORKSPACE 'node_modules') | Out-Null
          Push-Location $baseline
          try {
            npm run desktop:build
            if ($LASTEXITCODE -ne 0) { throw 'Baseline portable build failed' }
          } finally { Pop-Location }
          $before = Get-ChildItem (Join-Path $baseline 'release/*.exe') | Select-Object -First 1
          $after = Get-ChildItem 'release/*.exe' | Select-Object -First 1
          if (!$before -or !$after) { throw 'Portable output missing' }
          [ordered]@{ baselineCommit='800ca8015426d96a33ec90edc32b81fc7cde27dd'; currentCommit='${{ needs.apply.outputs.commit }}'; beforeBytes=$before.Length; afterBytes=$after.Length; savedBytes=($before.Length-$after.Length); savedPercent=[math]::Round(100*($before.Length-$after.Length)/$before.Length,4); note='Same Windows runner, Electron and installed dependencies; unsigned portable builds.' } | ConvertTo-Json | Tee-Object -FilePath test-results/portable-size-comparison.json
      - uses: actions/upload-artifact@v4
        with:
          name: Lyric-Player-Windows-x64-${{ needs.apply.outputs.commit }}
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: Lyric-Player-Web-${{ needs.apply.outputs.commit }}
          path: build/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Debug-regression-report-${{ github.run_id }}
          path: |
            test-results/issues-7-11/
            test-results/issues-1-6/
            test-results/lyric-polish/
            test-results/debug-diagnostics/
            test-results/package-size.json
            test-results/portable-size-comparison.json
            test-results/audio-analysis/report.json
          if-no-files-found: ignore
          retention-days: 14
