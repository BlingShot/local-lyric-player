name: Diagnostics workbench
on:
  push:
    branches: ['codex/debug-cache-package-20260917']
    paths: ['.github/workflows/diagnostics-workbench.yml']
permissions:
  contents: read
jobs:
  browser-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install chromium --only-shell
      - run: tar -czf diagnostic-browser.tgz -C ~/.cache/ms-playwright .
      - uses: actions/upload-artifact@v4
        with:
          name: diagnostic-browser
          path: diagnostic-browser.tgz
          retention-days: 1
