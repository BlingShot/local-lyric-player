name: Diagnostics workbench
on:
  push:
    branches: ['codex/debug-cache-package-20260917']
    paths: ['.github/workflows/diagnostics-workbench.yml']
permissions:
  contents: read
jobs:
  source-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: tar -czf "$RUNNER_TEMP/diagnostic-source.tgz" --exclude=.git .
      - uses: actions/upload-artifact@v4
        with:
          name: diagnostic-source
          path: ${{ runner.temp }}/diagnostic-source.tgz
          retention-days: 1
